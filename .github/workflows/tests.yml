name: Synthetic tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional test dependency
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q companion tests scripts
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - name: Verify safe default configuration
        run: python -c "import json; x=json.load(open('config.example.json',encoding='utf-8')); assert not x['enabled'] and not x['allowed_groups'] and not x['outbound_groups'] and not x['provider'].get('siwc_enabled')"
